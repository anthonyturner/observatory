# Publishes the README and chosen /docs pages to the repository wiki
# (npm run wiki:sync). The wiki is a generated mirror: edit /docs, not the wiki.
name: Wiki sync

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'server/wiki/**'
      - 'server/push/push-target.ts'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GIT_TERMINAL_PROMPT: 0
      WIKI_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git
    steps:
      - uses: actions/checkout@v5

      # GitHub creates a wiki's git repository only when its first page is
      # saved in the web UI, and no token can create it.
      - name: Check the wiki exists
        id: wiki
        run: |
          if error=$(git ls-remote "$WIKI_URL" 2>&1 >/dev/null); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -qi 'not found' <<< "$error"; then
            message="The wiki has no pages yet, so there is nothing to sync into. Save a first page named Home, with any text (the first sync replaces it), at ${{ github.server_url }}/${{ github.repository }}/wiki, then run this workflow again from the Actions tab."
            echo "::notice title=Wiki not created yet::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$error" >&2
            exit 1
          fi

      - uses: actions/setup-node@v5
        if: steps.wiki.outputs.exists == 'true'
        with:
          node-version: 24

      - name: Sync the pages
        if: steps.wiki.outputs.exists == 'true'
        run: |
          git clone --depth 1 "$WIKI_URL" "$RUNNER_TEMP/wiki"
          node server/wiki/wiki-sync-cli.ts --out="$RUNNER_TEMP/wiki"

      - name: Push the wiki
        if: steps.wiki.outputs.exists == 'true'
        working-directory: ${{ runner.temp }}/wiki
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'The wiki is already up to date.'
          else
            git commit --quiet -m "Sync from /docs at ${GITHUB_SHA::7}"
            git push
          fi
