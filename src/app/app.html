<router-outlet />
<footer
  #foot
  class="playlist"
  [class.playlist--beside-dock]="placement.isBesideDock()"
  [class.playlist--away]="!visibility.isShown()"
>
  <app-transport-bar id="playlist-player" />
  <app-player-toggle controls="playlist-player" />
</footer>
<app-status-strip
  appPublishHeight="--status-strip-height"
  class="status"
  [class.status--beside-dock]="placement.isBesideDock()"
  label="Status details"
>
  <app-usage-fact />
</app-status-strip>
<app-preview-banner />
<app-notice-stack />
