<label class="field">
  <span>Search</span>
  <input
    #box
    type="search"
    placeholder="Name"
    autocomplete="off"
    [value]="query()"
    (input)="query.set(box.value)"
  />
</label>

<label class="field">
  <span>Area</span>
  <select #choice (change)="area.set(choice.value || null)">
    <option value="" [selected]="area() === null">All areas</option>
    @for (option of areas(); track option.id) {
      <option [value]="option.id" [selected]="area() === option.id">{{ option.label }}</option>
    }
  </select>
</label>

@if (windows().length) {
  <label class="field">
    <span>Window</span>
    <select #pane (change)="window.set(pane.value || null)">
      <option value="" [selected]="window() === null">All windows</option>
      @for (option of windows(); track option) {
        <option [value]="option" [selected]="window() === option">{{ option }}</option>
      }
    </select>
  </label>
}

<div class="chips" role="group" aria-label="Show">
  <button type="button" [attr.aria-pressed]="heat() === null" (click)="heat.set(null)">All</button>
  <button
    type="button"
    data-heat="hot"
    title="Depended on by many nodes: a change here is felt widely"
    [attr.aria-pressed]="heat() === 'hot'"
    (click)="heat.set('hot')"
  >
    <span class="dot" aria-hidden="true"></span>Hot spots {{ totals().hot }}
  </button>
  <button
    type="button"
    data-heat="unused"
    title="Nothing depends on it: candidate dead code"
    [attr.aria-pressed]="heat() === 'unused'"
    (click)="heat.set('unused')"
  >
    <span class="dot" aria-hidden="true"></span>Unused {{ totals().unused }}
  </button>
</div>

<p class="count" role="status">{{ entries().length }} shown</p>

<ul>
  @for (entry of entries(); track entry.node.id) {
    <li>
      <button
        type="button"
        class="row"
        [attr.data-heat]="entry.heat"
        [attr.data-kind]="entry.node.kind"
        [title]="entry.node.file"
        [attr.aria-current]="entry.node.id === selected() ? 'true' : null"
        (click)="pick.emit(entry.node.id)"
      >
        <span class="dot" aria-hidden="true"></span>
        <span class="name">{{ entry.node.name }}</span>
        <span class="uses" [title]="'Depended on by ' + entry.dependents">{{
          entry.dependents
        }}</span>
      </button>
    </li>
  }
</ul>
