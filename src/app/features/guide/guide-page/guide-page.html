@let guide = shown();
@let open = book();
<header class="hud">
  <div class="way">
    <app-up-link to="/" label="Home" [guide]="null" />
  </div>
  <div class="brand">
    <h1>{{ open.title }}</h1>
    <span class="stamp">{{ open.stamp }}</span>
  </div>
</header>

<div class="room">
  <button
    type="button"
    class="abtn fold"
    aria-controls="guide-contents"
    [attr.aria-expanded]="isIndexOpen()"
    (click)="toggleIndex()"
  >
    {{ isIndexOpen() ? 'Hide contents' : 'Contents' }}
  </button>
  <aside id="guide-contents" class="index" [class.open]="isIndexOpen()" aria-label="Docs contents">
    <app-library-index
      [searchLabel]="filterLabel"
      listLabel="Contents"
      [shelves]="shelves()"
      [resultLine]="resultLine()"
      [isStill]="isStill()"
      [(query)]="query"
    />
  </aside>
  <main #reading class="reading" tabindex="-1">
    <article class="column" [attr.aria-label]="open.title">
      @if (guide.intro.length) {
        <app-doc-blocks [blocks]="guide.intro" />
      }
      @for (part of guide.parts; track part.id) {
        <app-doc-blocks class="part" [blocks]="part.lead" />
        @for (section of part.sections; track section.id) {
          <app-doc-blocks class="section" [blocks]="section.blocks" />
        }
      } @empty {
        <p class="empty">{{ emptyLine() }}</p>
      }
    </article>
  </main>
</div>
