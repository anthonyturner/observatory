<section
  id="projects"
  class="fleet"
  tabindex="-1"
  aria-labelledby="fleet-title"
  [attr.aria-busy]="waiting() !== null"
>
  <div class="head">
    <h2 id="fleet-title">Projects</h2>
    <span class="sub">blocked first</span>
    <span class="sub sum">{{ summary() }}</span>
    <app-top-link />
  </div>
  <div class="grid">
    @if (waiting(); as message) {
      <p class="empty" role="status">{{ message }}</p>
    } @else {
      @for (project of ordered(); track project.repo) {
        <app-project-card [project]="project" />
      } @empty {
        <p class="empty">No projects yet: the signed-in GitHub account owns no repositories.</p>
      }
    }
  </div>
</section>
