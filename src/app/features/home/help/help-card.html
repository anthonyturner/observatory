@if (help.isOpen()) {
  <aside
    class="card"
    role="dialog"
    aria-labelledby="help-title"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
  >
    <button class="close" type="button" aria-label="Close help" (click)="help.close()">
      &times;
    </button>
    <h2 id="help-title">Home</h2>
    <dl>
      @for (entry of entries; track entry.term) {
        <div class="entry">
          <dt>{{ entry.term }}</dt>
          <dd>{{ entry.meaning }}</dd>
        </div>
      }
    </dl>
    <p class="foot">
      Keys:
      @for (item of keys; track item.key; let last = $last) {
        <kbd>{{ item.key }}</kbd> {{ item.action }}{{ last ? '.' : ' · ' }}
      }
    </p>
  </aside>
}
