<app-sky-backdrop />

<div id="top" class="hud" tabindex="-1">
  <app-top-bar />
  <!-- Source order is the order a phone stacks them in and keys reach them. -->
  <div class="hud-body">
    <app-core-panel />
    <app-ask-panel class="column" />
    <app-vitals-panel class="column" />
    <app-skills-panel class="column" />
  </div>
</div>

<main>
  <app-news-section />
  <app-fleet-section />
  <app-agents-section />
</main>

<footer class="foot"><app-home-tools /></footer>

<app-agent-review-card />

<app-run-dock />

<app-reader-window />

<app-help-card title="Home" [entries]="helpEntries()" [keys]="helpKeys" />
