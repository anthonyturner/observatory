<app-hud-section heading="Skills" note="quick access">
  @if (total() > 0) {
    <div class="tiles" id="skill-tiles" role="group" aria-label="Skills">
      @for (skill of visible(); track skill.id) {
        <app-skill-tile [skill]="skill" />
      }
    </div>
  } @else {
    <p class="empty"><b>No skills yet</b>One-press tasks will appear here.</p>
  }

  <p class="browse" [class.none]="total() === 0">
    @if (hasMore()) {
      <button
        type="button"
        aria-controls="skill-tiles"
        [attr.aria-expanded]="isExpanded()"
        (click)="toggleExpanded()"
      >
        {{ isExpanded() ? 'Show fewer skills' : 'Browse all skills' }}
      </button>
    } @else {
      <span>Browse all skills</span>
    }
    <b>{{ total() }}</b>
  </p>
  <p class="note">One press proposes · you confirm</p>
</app-hud-section>
