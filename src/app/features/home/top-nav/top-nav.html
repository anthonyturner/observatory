<app-run-pill />
<a class="link" routerLink="/orrery">Orrery <span aria-hidden="true">&rsaquo;</span></a>
<div class="group" role="group" aria-label="Tools">
  <button type="button" title="Rebuild every project's counts from GitHub now">Refresh</button>
  <button
    type="button"
    [attr.aria-pressed]="!motion.isStill()"
    [title]="motionHint()"
    (click)="motion.toggle()"
  >
    {{ motion.isStill() ? 'Motion off' : 'Motion on' }}
  </button>
  <button
    type="button"
    [attr.aria-pressed]="sound.isOn()"
    [title]="
      sound.isOn() ? 'Ambient score playing — click to fade it out' : 'Play an ambient score'
    "
    (click)="sound.toggle()"
  >
    {{ sound.isOn() ? 'Sound on' : 'Sound off' }}
  </button>
</div>
<div class="group">
  <button
    type="button"
    aria-label="Help"
    title="What am I looking at? (?)"
    [attr.aria-pressed]="help.isOpen()"
    (click)="help.toggle()"
  >
    ?
  </button>
</div>
