<app-run-pill />
<nav class="group jumps" aria-label="Jump to">
  @for (jump of jumps(); track jump.id) {
    <a [href]="'#' + jump.id" [title]="jump.hint" (click)="sections.follow($event, jump.id)"
      >{{ jump.label }} <span aria-hidden="true">&darr;</span></a
    >
  }
</nav>
<app-live-agents-link label="Agent sessions" />
<app-inbox-link />
<a class="link" routerLink="/orrery">Orrery <span aria-hidden="true">&rsaquo;</span></a>
<a class="link" [routerLink]="guideLink">Guide <span aria-hidden="true">&rsaquo;</span></a>
