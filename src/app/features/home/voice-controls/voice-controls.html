<div class="head">
  <app-hud-section class="title" heading="Voice" note="tap to talk" [level]="3" />
  <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
</div>

<div class="level" [style.--level]="level()" aria-hidden="true">
  @for (weight of dashWeights; track $index) {
    <i [style.--k]="weight"></i>
  }
</div>

<div class="row">
  <button
    #mic
    type="button"
    class="mic"
    [class.loading]="micProgress() !== null"
    [style.--p]="micProgress()"
    [attr.aria-pressed]="talk.isRecording()"
    [attr.aria-disabled]="talk.isBlocked() || null"
    aria-describedby="voice-status"
    aria-keyshortcuts="M"
    aria-label="Tap to talk: press once to start and again to stop, or hold and let go to send"
    title="Tap to talk: press once to start and again to stop, or hold it or M and let go to send"
    (pointerdown)="onMicDown($event)"
    (pointerup)="talk.release()"
    (pointercancel)="talk.release()"
    (contextmenu)="$event.preventDefault()"
    (click)="onMicClick($event)"
  >
    {{ micWord() }}
  </button>
  <button
    #speak
    type="button"
    class="speak"
    [class.loading]="speakProgress() !== null"
    [style.--p]="speakProgress()"
    [attr.aria-pressed]="isSpeakOn()"
    aria-describedby="voice-status"
    [title]="
      isSpeakOn()
        ? 'Replies are read aloud, in this browser: press to stop'
        : 'Read replies aloud, in this browser'
    "
    (click)="onSpeak()"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
      @if (isSpeakOn()) {
        <path d="M15.5 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" />
      } @else {
        <path d="M16 9.5l5 5M21 9.5l-5 5" />
      }
    </svg>
    {{ isSpeakOn() ? 'Speak on' : 'Speak off' }}
  </button>
</div>

<p class="caption">Whisper hears · Kokoro speaks · both local</p>
<p class="hint">
  <span class="wide">Tap to talk, then tap again to send, or hold M and let go. Esc cancels.</span>
  <span class="touch">Tap to talk, then tap again to send, or hold it and let go.</span>
</p>
<app-voice-status-line
  id="voice-status"
  class="status"
  [line]="statusLine()"
  [resting]="restingLine()"
  (acted)="onAction($event)"
/>
<p class="said" aria-live="polite" [class.visually-hidden]="!said()?.isVisible">
  {{ said()?.words }}
</p>
