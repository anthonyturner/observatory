<app-usage-section [heading]="heading()" [small]="small()">
  @if (note(); as note) {
    <p class="note">{{ note }}</p>
  }
  <ng-content />
  @if (table(); as table) {
    <details>
      <summary>Table view</summary>
      <div class="table">
        <table>
          <caption class="visually-hidden">
            {{
              heading()
            }},
            {{
              small()
            }}
          </caption>
          <thead>
            <tr>
              @for (column of table.columns; track $index) {
                <th scope="col">{{ column }}</th>
              }
            </tr>
          </thead>
          <tbody>
            @for (row of table.rows; track row.key) {
              <tr>
                @for (cell of row.cells; track $index) {
                  <td>{{ cell }}</td>
                }
              </tr>
            }
          </tbody>
        </table>
      </div>
    </details>
  }
</app-usage-section>
