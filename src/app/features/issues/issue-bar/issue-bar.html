<div class="issuebar">
  <div class="toolgroup" role="tablist" aria-label="Open or closed issues">
    @for (each of tabs; track each.id) {
      <button
        type="button"
        role="tab"
        [attr.aria-selected]="screen.tab() === each.id"
        (click)="screen.setTab(each.id)"
      >
        {{ each.label }}<b>{{ screen.counts()?.[each.id] ?? '' }}</b>
      </button>
    }
  </div>
  <select
    aria-label="Show only one label"
    [disabled]="!screen.labels().length"
    (change)="onLabel($event)"
  >
    <option value="">All labels</option>
    @for (option of screen.labels(); track option.name) {
      <option [value]="option.name" [selected]="option.name === screen.label()">
        {{ option.name }} ({{ option.count }})
      </option>
    }
  </select>
  <input
    type="search"
    placeholder="Search titles or #n"
    aria-label="Search issue titles"
    autocomplete="off"
    [value]="screen.query()"
    (input)="onQuery($event)"
  />
</div>
