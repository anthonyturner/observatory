<header class="hud">
  <app-project-bar-room />
  <div class="brand">
    <h1>Library</h1>
    <span class="stamp">{{ stamp() }}</span>
  </div>
  @if (note(); as note) {
    <p class="note">
      {{ note }}
      @if (sourceUrl(); as url) {
        <a [href]="url" target="_blank" rel="noopener noreferrer"
          >On GitHub <span aria-hidden="true">↗</span></a
        >
      }
    </p>
  }
</header>

@if (hasPages()) {
  <div class="room">
    <button
      type="button"
      class="abtn fold"
      aria-controls="library-index"
      [attr.aria-expanded]="isIndexOpen()"
      (click)="toggleIndex()"
    >
      {{ isIndexOpen() ? 'Hide pages' : 'Pages' }}
    </button>
    <aside id="library-index" class="index" [class.open]="isIndexOpen()" aria-label="Library index">
      <app-library-index
        [shelves]="shelves()"
        [resultLine]="resultLine()"
        [isStill]="isStill()"
        [(query)]="query"
      />
    </aside>
    <main #reading class="reading" tabindex="-1">
      @if (article(); as article) {
        <app-doc-article [article]="article" [neighbours]="neighbours()" />
      }
    </main>
  </div>
}

@if (message(); as message) {
  <div class="state" role="status">
    <strong>{{ message.headline }}</strong>
    @if (message.detail) {
      <span>{{ message.detail }}</span>
    }
  </div>
}
