<app-orrery-canvas
  #canvas
  [worlds]="worlds()"
  [shipped]="shipped.items()"
  [(selected)]="selected"
  (open)="openQueue($event)"
/>
<app-fog-veil class="fog" [level]="fog().level" />

<header class="hud top">
  <div>
    <app-up-link to="/" label="Home" guide="orrery" />
    <div class="brand">
      <h1>Orrery</h1>
      <span class="stamp">{{ stamp() }}</span>
      @if (fog().age; as age) {
        <span
          class="stale"
          title="The data has not been refreshed for a while. Refresh on Home clears the fog."
          >fogged · {{ age }} old</span
        >
      }
    </div>
  </div>
</header>

@if (waiting(); as message) {
  <p class="state" role="status">{{ message }}</p>
}

@if (selectedWorld(); as world) {
  <app-world-card
    [world]="world"
    (closed)="selected.set(null)"
    (showOnHome)="showOnHome($event)"
    (openQueue)="openQueue($event)"
    (pointerenter)="canvas.holdCard()"
    (pointerleave)="canvas.releaseCard()"
  />
}

<app-help-card title="Orrery" [entries]="helpEntries" [keys]="helpKeys" guide="orrery" />

<footer class="hud bottom">
  <app-orrery-tools
    [refreshing]="refreshing()"
    (zoomOut)="canvas.zoomOut()"
    (zoomIn)="canvas.zoomIn()"
    (fit)="canvas.fit()"
    (refresh)="refresh()"
  />
</footer>
