<app-orrery-canvas #canvas [worlds]="worlds()" [(selected)]="selected" (open)="openQueue($event)" />
<app-fog-veil class="fog" [level]="fog().level" />

<header class="hud top">
  <div class="brand">
    <h1>Orrery</h1>
    <span class="stamp">{{ stamp() }}</span>
    @if (fog().age; as age) {
      <span
        class="stale"
        title="The data has not been refreshed for a while. Refresh on Home clears the fog."
        >fogged · {{ age }} old</span
      >
    }
  </div>
  <nav class="links" aria-label="Page">
    <app-help-button />
    <a class="home" routerLink="/"><span aria-hidden="true">&lsaquo;</span> Home</a>
  </nav>
</header>

@if (waiting(); as message) {
  <p class="state" role="status">{{ message }}</p>
}

@if (selectedWorld(); as world) {
  <app-world-card
    [world]="world"
    (closed)="selected.set(null)"
    (showOnHome)="showOnHome($event)"
    (openQueue)="openQueue($event)"
    (pointerenter)="canvas.holdCard()"
    (pointerleave)="canvas.releaseCard()"
  />
}

<app-help-card title="Orrery" [entries]="helpEntries" [keys]="helpKeys" />

<footer class="hud bottom">
  <app-orrery-tools (zoomOut)="canvas.zoomOut()" (zoomIn)="canvas.zoomIn()" (fit)="canvas.fit()" />
</footer>
