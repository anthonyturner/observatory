<ol aria-label="Tracks">
  @for (row of rows(); track row.track.videoId; let index = $index) {
    <li>
      <button
        type="button"
        class="pick"
        [attr.aria-current]="row.isCurrent ? 'true' : null"
        (click)="picked.emit(index)"
      >
        <span class="title">{{ row.track.title }}</span>
        <span class="artist">{{ row.track.artist }} · {{ row.track.genre }}</span>
      </button>
      <button
        type="button"
        class="heart"
        [attr.aria-pressed]="row.isFavorite"
        [attr.aria-label]="'Favourite: ' + row.track.title"
        (click)="favoriteToggled.emit(row.track)"
      >
        <span aria-hidden="true">{{ row.isFavorite ? '♥' : '♡' }}</span>
      </button>
    </li>
  }
</ol>
