<div class="above" data-playlist-above [class.above--large]="isVideoLarge()">
  @if (listOpen()) {
    <app-track-list
      id="playlist-tracks"
      [tracks]="player.tracks()"
      [currentIndex]="player.index()"
      [favoriteIds]="favoriteIds()"
      (picked)="pick($event)"
      (favoriteToggled)="favorites.toggle($event)"
    />
  }
  <div class="card" [class.card--live]="isCardShown()" [class.card--large]="isVideoLarge()">
    <!-- YouTube replaces whatever is inside the screen, so the button sits beside it. -->
    <div #screen class="screen"></div>
    @if (isCardShown()) {
      <button
        type="button"
        class="enlarge"
        aria-label="Bigger video"
        [attr.aria-pressed]="isVideoLarge()"
        [title]="isVideoLarge() ? 'Back to the usual size' : 'Make the video bigger'"
        (click)="isVideoLarge.set(!isVideoLarge())"
      >
        <span aria-hidden="true">{{ isVideoLarge() ? '⤡' : '⤢' }}</span>
      </button>
    }
  </div>
  <p class="notice" aria-live="polite">{{ transfer.notice() }}</p>
</div>
<div class="deck" role="group" aria-label="Playlist">
  <div class="scrub">
    <button
      type="button"
      aria-label="Back 15 seconds"
      title="Back 15 seconds"
      [disabled]="!player.canSeek()"
      (click)="player.skip(-backStep)"
    >
      <span aria-hidden="true">⏪︎</span>
    </button>
    <span class="scrub__time" aria-hidden="true">{{ elapsedLabel() }}</span>
    <input
      type="range"
      min="0"
      step="1"
      aria-label="Position in track"
      [max]="player.duration()"
      [value]="shownElapsed()"
      [attr.aria-valuetext]="positionWords()"
      [disabled]="!player.canSeek()"
      (input)="onScrub($event)"
      (change)="onScrubbed($event)"
    />
    <span class="scrub__time" aria-hidden="true">{{ durationLabel() }}</span>
    <button
      type="button"
      aria-label="Forward 30 seconds"
      title="Forward 30 seconds"
      [disabled]="!player.canSeek()"
      (click)="player.skip(forwardStep)"
    >
      <span aria-hidden="true">⏩︎</span>
    </button>
  </div>
  <div class="bar">
    <div class="transport">
      <button type="button" aria-label="Previous track" title="Previous track" (click)="previous()">
        <span aria-hidden="true">⏮</span>
      </button>
      <button
        type="button"
        class="transport__play"
        [attr.aria-label]="player.isPlaying() ? 'Pause' : 'Play'"
        [title]="player.isPlaying() ? 'Pause the playlist' : 'Play the playlist'"
        (click)="toggle()"
      >
        <span aria-hidden="true">{{ player.isPlaying() ? '❚❚' : '▶' }}</span>
      </button>
      <button type="button" aria-label="Next track" title="Next track" (click)="next()">
        <span aria-hidden="true">⏭</span>
      </button>
    </div>
    <button
      type="button"
      class="heart"
      [attr.aria-pressed]="isFavorite()"
      aria-label="Favourite"
      [title]="
        isFavorite()
          ? 'Remove this track from your favourites'
          : 'Save this track to your favourites'
      "
      (click)="favorites.toggle(player.current())"
    >
      <span aria-hidden="true">{{ isFavorite() ? '♥' : '♡' }}</span>
    </button>
    <p class="now" aria-live="polite">
      <span class="now__title">{{ player.current().title }}</span>
      <span class="now__meta">{{ status() }} · {{ position() }}</span>
    </p>
    @if (!fold.isFolded()) {
      <div id="playlist-extras" class="extras">
        <label class="volume"
          ><span aria-hidden="true">Vol</span
          ><input
            type="range"
            min="0"
            max="1"
            step="0.05"
            aria-label="Playlist volume"
            [value]="player.volume()"
            (input)="onVolume($event)"
        /></label>
        <div class="group" role="group" aria-label="List">
          <div class="source" role="group" aria-label="Which list plays">
            <button
              type="button"
              [attr.aria-pressed]="library.source() === 'mix'"
              title="Play today's shuffled mix"
              (click)="choose('mix')"
            >
              Mix
            </button>
            <button
              type="button"
              [attr.aria-pressed]="library.source() === 'favorites'"
              [disabled]="!library.hasFavorites()"
              [title]="favoritesHint()"
              (click)="choose('favorites')"
            >
              <span aria-hidden="true">♥</span> {{ favorites.count() }}
              <span class="visually-hidden">favourites</span>
            </button>
          </div>
          <button
            type="button"
            class="tracks"
            aria-controls="playlist-tracks"
            [attr.aria-expanded]="listOpen()"
            (click)="listOpen.set(!listOpen())"
          >
            Tracks
          </button>
          <div class="transfer" role="group" aria-label="Favourites file">
            <button
              type="button"
              aria-label="Export favourites"
              [attr.aria-disabled]="library.hasFavorites() ? null : 'true'"
              [title]="exportHint()"
              (click)="transfer.exportFile()"
            >
              <span aria-hidden="true">⤓</span>
            </button>
            <button
              type="button"
              aria-label="Import favourites"
              title="Add the favourites from an exported file to yours"
              (click)="picker.click()"
            >
              <span aria-hidden="true">⤒</span>
            </button>
            <input
              #picker
              type="file"
              accept=".json,application/json"
              hidden
              (change)="importPicked(picker)"
            />
          </div>
        </div>
        @if (sky.isShown()) {
          <div class="group group--sky" role="group" aria-label="Sky">
            <button
              type="button"
              class="video"
              [attr.aria-pressed]="videoBackground.isOn()"
              [title]="
                videoBackground.isOn()
                  ? 'Back to the Milkdrop visuals behind the page'
                  : 'Play the video full screen behind the page instead of Milkdrop'
              "
              (click)="videoBackground.toggle()"
            >
              Video
            </button>
            <label
              class="visual"
              title="Pick the Milkdrop visual, or Auto to change it with the music"
              ><span aria-hidden="true">Visual</span
              ><select
                aria-label="Milkdrop visual"
                [disabled]="videoBackground.isOn()"
                (change)="onMilkdropPreset($event)"
              >
                <option value="" [selected]="milkdrop.preset() === null">Auto</option>
                @for (preset of milkdrop.presets; track preset) {
                  <option [value]="preset" [selected]="milkdrop.preset() === preset">
                    {{ preset }}
                  </option>
                }
              </select></label
            >
            <label class="opacity" title="How strongly the Milkdrop visuals show over the sky"
              ><span aria-hidden="true">Sky</span
              ><input
                type="range"
                min="0"
                max="1"
                step="0.05"
                aria-label="Milkdrop visuals opacity"
                [value]="milkdropOpacity.level()"
                [disabled]="videoBackground.isOn()"
                (input)="onMilkdropOpacity($event)"
            /></label>
            <!-- No phone's browser can share a tab's audio, so there it never shows. -->
            @if (pulse.canListen) {
              <button
                type="button"
                class="sync"
                [attr.aria-pressed]="sync().isOn"
                [disabled]="sync().isUnavailable"
                [title]="sync().hint"
                (click)="toggleSync()"
              >
                {{ sync().text }}
              </button>
            }
          </div>
        }
      </div>
    }
    <button
      type="button"
      class="fold"
      aria-label="More playlist controls"
      aria-controls="playlist-extras"
      [attr.aria-expanded]="!fold.isFolded()"
      [title]="
        fold.isFolded() ? 'Show all the playlist controls' : 'Fold the bar down to the essentials'
      "
      (click)="toggleFold()"
    >
      <span aria-hidden="true">{{ fold.isFolded() ? '‹' : '›' }}</span>
    </button>
  </div>
</div>
