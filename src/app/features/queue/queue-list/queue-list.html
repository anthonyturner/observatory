@for (section of sections(); track section.bucket) {
  <section [style.--sev]="section.color" [attr.aria-labelledby]="'bucket-' + section.bucket">
    <h2 [id]="'bucket-' + section.bucket">
      {{ section.name }}<small>{{ section.meaning }} · {{ section.rows.length }}</small>
    </h2>
    <ul>
      @for (row of section.rows; track row.number) {
        <li>
          <button type="button" class="open" (click)="picked.emit(row.number)">
            <span class="number">#{{ row.number }}</span>
            <span class="title">{{ row.title }}</span>
            @if (row.isDraft) {
              <span class="draft">draft</span>
            }
            <span class="detail">{{ row.detail }}</span>
            @if (row.hiddenNote) {
              <span class="note">{{ row.hiddenNote }}</span>
            }
          </button>
          <a class="github" [href]="row.url" target="_blank" rel="noopener"
            >GitHub <span aria-hidden="true">&#8599;</span
            ><span class="visually-hidden">: #{{ row.number }}, in a new tab</span></a
          >
        </li>
      }
    </ul>
  </section>
}
