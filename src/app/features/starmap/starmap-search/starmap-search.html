<form role="search" (submit)="submit($event)" (mouseleave)="close()">
  <div class="field">
    <input
      type="search"
      role="combobox"
      placeholder="Find any PR or issue, open or done: title or #n"
      aria-label="Find a pull request or issue by title or number"
      aria-autocomplete="list"
      aria-controls="starmap-search-list"
      autocomplete="off"
      [attr.aria-expanded]="expanded()"
      [attr.aria-activedescendant]="active() >= 0 ? 'starmap-search-option-' + active() : null"
      [attr.aria-describedby]="miss() ? 'starmap-search-miss' : null"
      [value]="query()"
      (click)="open()"
      (focus)="open()"
      (blur)="close()"
      (input)="type($any($event.target).value)"
      (keydown)="onKey($event)"
    />
    <ul id="starmap-search-list" role="listbox" aria-label="Suggestions" [hidden]="!expanded()">
      @for (row of rows(); track $index; let index = $index) {
        <li
          role="option"
          [id]="'starmap-search-option-' + index"
          [attr.aria-selected]="index === active()"
          (mousedown)="$event.preventDefault()"
          tabindex="-1"
          (click)="pick(row.suggestion)"
          (keydown.enter)="pick(row.suggestion)"
        >
          <span class="text">{{ row.text }}</span>
          @if (row.tag; as tag) {
            <span class="tag">{{ tag }}</span>
          }
        </li>
      }
    </ul>
  </div>
  <button type="submit">Go</button>
  @if (miss(); as words) {
    <span id="starmap-search-miss" class="miss" role="status">{{ words }}</span>
  }
</form>
