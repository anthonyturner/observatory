<section [attr.aria-labelledby]="headingId">
  @if (level() === 3) {
    <h3 class="label" [class.ruled]="ruled()" [id]="headingId">
      <ng-container *ngTemplateOutlet="headingText" />
    </h3>
  } @else {
    <h2 class="label" [class.ruled]="ruled()" [id]="headingId">
      <ng-container *ngTemplateOutlet="headingText" />
    </h2>
  }
  <ng-content />
</section>

<ng-template #headingText>
  {{ heading() }}
  @if (note(); as note) {
    <small>{{ note }}</small>
  }
</ng-template>
