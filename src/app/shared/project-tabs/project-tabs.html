<nav aria-label="Project screens">
  @for (tab of links(); track tab.id) {
    <a [routerLink]="tab.link" [attr.aria-current]="tab.isCurrent ? 'page' : null"
      >{{ tab.label }}
      @if (tab.badge; as badge) {
        <span class="badge" aria-hidden="true">{{ badge.shown }}</span
        ><span class="visually-hidden">, {{ badge.spoken }}</span>
      }
    </a>
  }
</nav>
