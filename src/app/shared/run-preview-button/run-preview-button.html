@if (view(); as shown) {
  <div class="run" role="group" [attr.aria-label]="labels().group">
    @if (shown.canRun) {
      <button type="button" [attr.aria-label]="labels().run" (click)="run()">
        <span aria-hidden="true">&#9654;</span> {{ labels().runText }}
      </button>
    }
    @if (shown.progress) {
      <button type="button" disabled>{{ shown.progress }}</button>
    }
    @if (shown.openUrl; as url) {
      <a
        [href]="url"
        target="_blank"
        rel="noopener noreferrer"
        (click)="openedByHand()"
        [attr.aria-label]="labels().open"
        >Open <span aria-hidden="true">&#8599;</span></a
      >
    }
    @if (shown.liveUrl; as url) {
      <a
        [href]="url"
        target="_blank"
        rel="noopener noreferrer"
        [attr.aria-label]="'Live site of ' + repo() + ' in a new tab'"
        >Live site <span aria-hidden="true">&#8599;</span></a
      >
    }
    @if (shown.canRemove) {
      <button type="button" [attr.aria-label]="labels().remove" (click)="stop()">
        <span aria-hidden="true">&#10005;</span> Remove
      </button>
    }
    @if (shown.canStop) {
      <button type="button" [attr.aria-label]="labels().stop" (click)="stop()">
        <span aria-hidden="true">&#9632;</span> Stop
      </button>
    }
    @if (!shown.liveUrl) {
      <span class="note" [class.problem]="shown.isProblem" role="status">{{ shown.note }}</span>
    }
  </div>
}
