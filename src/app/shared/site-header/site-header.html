<div
  class="bar"
  [class.menu]="fit().isMenu"
  [class.measured]="isMeasured()"
  [appDisclosure]="fit().isMenu ? menuButton : moreButton"
  #disclosure="appDisclosure"
>
  <div class="inner" #inner>
    <a class="logo" #logo routerLink="/" aria-label="Observatory, Home">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(-24 12 12)" />
        <circle class="core" cx="12" cy="12" r="3.2" />
        <circle class="moon" cx="20" cy="7" r="1.5" />
      </svg>
      <span class="wordmark" aria-hidden="true">Observatory</span>
    </a>
    @if (title(); as heading) {
      <span class="title" [attr.title]="heading">{{ heading }}</span>
    }
    <nav class="links" aria-label="Site">
      @for (screen of screens(); track screen.id; let index = $index) {
        <a
          #screenLink
          class="link"
          [class.quiet]="screen.isQuiet"
          [class.folded]="index >= fit().visible"
          [routerLink]="screen.link"
          [attr.aria-current]="screen.isCurrent ? 'page' : null"
          ><app-section-label [section]="screen"
        /></a>
      }
      <button
        #moreButton
        type="button"
        class="more"
        [class.current]="behind().isCurrent"
        [class.inactive]="fit().isMenu"
        [attr.aria-expanded]="disclosure.isOpen()"
        [attr.aria-controls]="disclosure.panelId"
        [attr.aria-current]="behind().isCurrent ? 'true' : null"
        (click)="disclosure.toggle()"
      >
        More
        <span class="chevron" aria-hidden="true"></span>
        @if (behind().hasDot) {
          <span class="dot" aria-hidden="true"></span>
        }
        @if (behind().spoken; as spoken) {
          <span class="visually-hidden">, {{ spoken }}</span>
        }
      </button>
      <div class="panel" [id]="disclosure.panelId" [class.open]="disclosure.isOpen()">
        <div class="folded-links">
          @for (screen of behind().screens; track screen.id) {
            <a
              [routerLink]="screen.link"
              [attr.aria-current]="screen.isCurrent ? 'page' : null"
              (click)="disclosure.closeToTrigger()"
              ><app-section-label [section]="screen"
            /></a>
          }
        </div>
        <div class="exits">
          @for (exit of exits(); track exit.id) {
            <a
              [routerLink]="exit.link"
              [fragment]="exit.fragment"
              (click)="disclosure.closeToTrigger()"
              ><app-section-label [section]="exit"
            /></a>
          }
        </div>
      </div>
    </nav>
    <div class="end" #end>
      <ng-content select="[siteHeaderTool]" />
      <ng-content select="[siteHeaderChip]" />
    </div>
    <button
      #menuButton
      type="button"
      class="menu-toggle"
      [class.inactive]="!fit().isMenu"
      [attr.aria-expanded]="disclosure.isOpen()"
      [attr.aria-controls]="disclosure.panelId"
      (click)="disclosure.toggle()"
    >
      <span class="glyph" aria-hidden="true">☰</span>
      <span class="visually-hidden">Menu</span>
      @if (behind().hasDot) {
        <span class="dot" aria-hidden="true"></span>
      }
      @if (behind().spoken; as spoken) {
        <span class="visually-hidden">, {{ spoken }}</span>
      }
    </button>
  </div>
</div>
