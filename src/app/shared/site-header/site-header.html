<div class="bar" [appDisclosure]="toggle" #menu="appDisclosure">
  <a class="logo" routerLink="/" aria-label="Observatory, Home">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(-24 12 12)" />
      <circle class="core" cx="12" cy="12" r="3.2" />
      <circle class="moon" cx="20" cy="7" r="1.5" />
    </svg>
    <span class="wordmark" aria-hidden="true">Observatory</span>
  </a>
  @if (title(); as heading) {
    <span class="title" [attr.title]="heading">{{ heading }}</span>
  }
  <button
    #toggle
    type="button"
    class="toggle"
    [attr.aria-expanded]="menu.isOpen()"
    [attr.aria-controls]="menu.panelId"
    (click)="menu.toggle()"
  >
    <span class="glyph" aria-hidden="true">☰</span>
    <span class="visually-hidden">Menu</span>
    @if (toggleView().hasDot) {
      <span class="dot" aria-hidden="true"></span>
    }
    @if (toggleView().spoken; as spoken) {
      <span class="visually-hidden">, {{ spoken }}</span>
    }
  </button>
  <div class="row"><ng-content /></div>
  <div class="menu" [id]="menu.panelId" [class.open]="menu.isOpen()">
    <nav aria-label="Site">
      @for (section of sections(); track section.id) {
        <a
          [routerLink]="section.link"
          [fragment]="section.fragment"
          [attr.aria-current]="section.isCurrent ? 'page' : null"
          [class.quiet]="section.isQuiet"
          (click)="menu.closeToTrigger()"
          ><app-section-label [section]="section"
        /></a>
      }
    </nav>
    <div class="tool"><ng-content select="[siteHeaderTool]" /></div>
  </div>
</div>
