<svg [attr.viewBox]="'0 0 ' + width + ' ' + height" preserveAspectRatio="none">
  @if (shape().path; as path) {
    <path class="line" [attr.d]="path" />
    @if (shape().lastPoint; as dot) {
      <!-- A zero-length round-capped stroke stays a round dot however the
           line is stretched. -->
      <path class="dot" [attr.d]="'M' + dot.x + ',' + dot.y + 'h0.01'" />
    }
  } @else {
    <line class="base" x1="0" [attr.x2]="width" [attr.y1]="baselineY" [attr.y2]="baselineY" />
  }
</svg>
