<div class="toolgroup" role="tablist" [attr.aria-label]="label()">
  @for (tab of tabs(); track tab.id; let index = $index) {
    <button
      #tab
      type="button"
      role="tab"
      [id]="tabIds()[index]"
      [attr.aria-selected]="tab.id === selected()"
      [attr.aria-controls]="panelId()"
      [attr.tabindex]="tab.id === selected() ? 0 : -1"
      (click)="selectedChange.emit(tab.id)"
      (keydown)="onKeydown($event, index)"
    >
      {{ tab.label }}
      @if (tab.note) {
        <b aria-hidden="true" [class.bad]="tab.isBad">{{ tab.note }}</b>
      }
      <span class="visually-hidden">{{ tab.spokenNote }}</span>
    </button>
  }
</div>
